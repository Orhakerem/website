    seuil: >-
      au 20/11, trois cas : (a) lead du 01/11 confirmé réel → ne pas rouvrir
      le diagnostic, sans conclure à un tunnel réparé sur un seul lead ;
      (b) confirmé test et aucun autre generate_lead réel sur 28 j → rouvrir
      le diagnostic du tunnel ; (c) non qualifié au 20/11 → le traiter comme
      non probant : il ne compte pas, la branche (b) s'applique sur les autres
      generate_lead de la fenêtre, et la question est reposée en tête du
      rapport 2026-12
    mesurer_le: 2026-11-20
    contexte: >-
      Octobre : 0 lead réel présumé (le seul generate_lead est un test du
      23/10). Le 01/11 : 1 generate_lead + 1 contact_outbound, réel présumé
      mais non vérifié. Qualification à demander au propriétaire avant le
      20/11 : courriel Resend reçu ou ligne `reservations` du 01/11. Le cas
      (c) applique la règle de prudence du cycle : un lead non vérifié ne
      ferme pas un diagnostic.

