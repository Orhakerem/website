    echeance: 2026-12-04
    seuil: >-
      au relevé 2026-12, garder si au moins 45 impressions cumulées sur les 3
      locales du 01/09 au 30/11, ou au moins 1 clic ; sinon fusionner dans
      private-events-tel-aviv-intimate-celebrations avec redirection 301 des
      3 URL vers la locale correspondante
    contexte: >-
      Relevé 2026-11 (gsc, 3 locales) : 23 impressions en septembre (he 3, fr
      14, en 6), 11 en octobre (he 6, fr 3, en 2), 0 clic sur les deux mois.
      45 = 34 déjà acquises + au moins 11 en novembre, soit tenir le niveau
      d'octobre ; en dessous, la pente 23 → 11 se poursuit. Sur la même
      période, private-events (3 locales) passe de 14 à 19 impressions avec
      1 clic chaque mois : c'est la page à garder en cas de cannibalisation.
      Attention : le commit 27613a9 (preview) ajoute dans small-jewish un
      lien entrant vers hanukkah-tel-aviv-sufganiyot-candle-lighting en en,
      fr et he. Une fusion devra reporter ces 3 liens ailleurs (par exemple
      dans private-events) en respectant le plafond de 6 liens internes.

