a_surveiller:
  - quoi: Intégrer au relevé 2026-12 les lectures hors relevé H1-H7 et remesurer la marque sur novembre
    mesurer_le: 2026-12-04
    seuil: >-
      si H4 n'est pas confirmé (accueil hors de 9-17 impressions/jour du 03 au
      08/09), rouvrir la baseline home-title-retour-2026-11-04 ; marque, une
      seule mesure : `or hakerem` en requête exacte dans GSC, impressions de
      novembre 2026, au relevé du 2026-12-04. 0 impression en novembre après
      0 en octobre (deux mois de suite) → perte probable, à instruire dans
      l'action entite-concurrente de seo/registre-actions.yml avec un contrôle
      manuel du SERP de marque (recherche « Or Hakerem », rang du site). Au
      moins 1 impression → clore le sujet : le 0 d'octobre est traité comme un
      masquage ponctuel et l'entrée disparaît au cycle suivant. Cette mesure
      ne distingue PAS l'anonymisation d'une perte : à environ 50 clics par
      mois le volume est trop faible pour qu'un critère GSC tranche, et les
      titles de / et /he ont changé le 04/11, ce qui casse la comparaison
      avec septembre-octobre. Le filtre « contient hakerem » n'entre pas dans
      la mesure.
    contexte: >-
      Séries journalières GSC du 25/08 au 20/09 (site, article plage, /blog, /),
      filtres « contient hakerem » / « contient kerem » (H6 : 124 impressions et
      0 clic en octobre, 134 et 8 clics en septembre) et inspection d'URL de
      l'article plage (H7), à vérifier à l'étape 4 comme le reste du relevé.
      Marque, relevé 2026-11 : `or hakerem` 6 clics pour 14 impressions
      (position 1,5) en septembre, 0 impression en octobre (diagnostic C6).
      Décision du propriétaire du 05/11, après trois refus : on renonce à
      trancher entre anonymisation et perte réelle et on ne garde que cette
      mesure observable. Les 124 impressions d'octobre du filtre « contient
      hakerem » sont `hakerem` (88, générique, ha-kerem.co.il 1er) et
      `hakerem luxury apartments` (36, marque du concurrent) : aucune ne vient
      de notre marque, et une requête anonymisée n'apparaît dans aucun filtre
      par requête. Cette entrée ne porte que la mesure du cycle 2026-12 et
      son critère ; l'instruction de la collision de marque reste dans
      l'action entite-concurrente de seo/registre-actions.yml.

  - quoi: Indexation puis impressions de hanukkah-tel-aviv-sufganiyot-candle-lighting (en/fr/he)
