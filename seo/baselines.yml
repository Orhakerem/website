# Baselines — Or Hakerem
#
# Toute modification d'un élément qui PERFORME déjà (title, meta description,
# H1, structure d'une page qui reçoit du trafic) crée une entrée ici AVANT la
# modification, avec son seuil de retour arrière et la date à laquelle le
# verdict devra tomber.
#
# `mesures` = relevés successifs, purement factuels.
# `verdict` = la décision, une seule par baseline : confirme | retour-arriere
# `verdict_attendu_le` = date ferme. `scripts/seo-check.mjs` bloque si elle est
# échue et que le verdict est encore null. Pas de report possible.

baselines:
  - id: home-title-2026-09-22
    url: /
    element: title
    avant: "Luxury Apartments in Tel Aviv | Or Hakerem | Kerem HaTeimanim"
    apres: "Luxury Apartments in Tel Aviv | Or Hakerem"
    date: 2026-09-22
    motif: >-
      Retrait du suffixe « Kerem HaTeimanim » — requête en position 17,5 pour
      0,4 % de CTR, jugée non méritante d'un tiers du title.
    metriques_avant:
      source: gsc
      clics: 16
      impressions: 386
      ctr: 4.1
      position: 6.5
    seuil_retour_arriere: "clics -25 % ou plus à impressions ±15 % sur 28 j"
    mesures:
      - date: 2026-10-20
        source: gsc
        clics: 10
        impressions: 296
        position: 6.7
        constat: "clics -37,5 %, impressions -23 %, position stable"
      - date: 2026-10-24
        source: gsc
        clics: 9
        impressions: 324
        position: 6.6
        constat: >-
          Deuxième baisse consécutive, cette fois à impressions ET position
          stables. L'explication saisonnière ne tient plus.
    verdict: null
    verdict_attendu_le: 2026-11-17
    note: >-
      Seuil franchi sur les deux mesures. Verdict attendu : retour-arriere.
      À trancher au cycle de novembre, étape 5.

