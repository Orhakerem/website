# Baselines — Or Hakerem
#
# Toute modification d'un élément qui PERFORME déjà (title, meta description,
# H1, structure d'une page qui reçoit du trafic) crée une entrée ici AVANT la
# modification, avec son seuil de retour arrière et la date à laquelle le
# verdict devra tomber.
#
# `mesures` = relevés successifs, purement factuels.
# `verdict` = la décision, une seule par baseline : confirme | retour-arriere
# `verdict_attendu_le` = date ferme. `scripts/seo-check.mjs` bloque si elle est
# échue et que le verdict est encore null. Pas de report possible.

baselines:
  - id: home-title-2026-09-22
    url: /
    element: title
    avant: "Luxury Apartments in Tel Aviv | Or Hakerem | Kerem HaTeimanim"
    apres: "Luxury Apartments in Tel Aviv | Or Hakerem"
    date: 2026-09-22
    motif: >-
      Retrait du suffixe « Kerem HaTeimanim » — requête en position 17,5 pour
      0,4 % de CTR, jugée non méritante d'un tiers du title.
    metriques_avant:
      source: gsc
      clics: 16
      impressions: 386
      ctr: 4.1
      position: 6.5
    seuil_retour_arriere: "clics -25 % ou plus à impressions ±15 % sur 28 j"
    mesures:
      - date: 2026-10-20
        source: gsc
        clics: 10
        impressions: 296
        position: 6.7
        constat: "clics -37,5 %, impressions -23 %, position stable"
      - date: 2026-10-24
        source: gsc
        clics: 9
        impressions: 324
        position: 6.6
        constat: >-
          Deuxième baisse consécutive, cette fois à impressions ET position
          stables. L'explication saisonnière ne tient plus.
      - date: 2026-11-04
        source: gsc
        periode: "2026-10-04..2026-10-31 (28 j), URL exacte https://www.orhakerem.com/"
        clics: 12
        impressions: 315
        ctr: 3.8
        position: 6.0
        comparaison_28j_precedents:
          periode: "2026-09-06..2026-10-03"
          clics: 15
          impressions: 328
          ctr: 4.6
          position: 6.8
        constat: >-
          Vs metriques_avant (16 / 386 / 4,1 % / 6,5) : clics -25,0 %,
          impressions -18,4 %, CTR -0,3 pt, position 6,5 → 6,0 (meilleure).
          Vs 28 j précédents : clics -20 %, impressions -4 %, CTR -0,8 pt,
          position 6,8 → 6,0. Seuil littéral non franchi sur cette mesure
          (clics -25 % atteint vs avant, mais impressions hors de la bande
          ±15 % ; vs période précédente, clics -20 % seulement). Troisième
          relevé consécutif sous metriques_avant en clics et en CTR.
    verdict: retour-arriere
    verdict_attendu_le: 2026-11-17
    note: >-
      Tranché le 2026-11-04 (aucun cycle avant l'échéance du 17/11).
      Trois relevés GSC post-changement, tous sous l'état d'avant en clics
      (10, 9, 12 contre 16) et en CTR (3,4 %, 2,8 %, 3,8 % contre 4,1 %),
      alors que la position est stable ou meilleure (6,7 ; 6,6 ; 6,0 contre
      6,5). Un CTR inférieur à position égale ou meilleure n'est pas
      saisonnier : c'est la présentation (le title) qui rend moins.
      La part saisonnière existe et est dite : la fenêtre de référence
      (25/08–21/09) couvre Roch Hachana et Yom Kippour, la fenêtre mesurée
      (04/10–31/10) est entièrement post-Souccot ; la baisse d'impressions
      (-18,4 %) peut en relever, et sur ce seul relevé l'écart de CTR
      (-0,3 pt) est faible, à effectif de 12 clics. Données donc ambiguës,
      et le seuil littéral n'est franchi sur aucun relevé (impressions
      -23 %, -16 %, -18 % : toujours hors de la bande ±15 %). Règle de
      prudence appliquée : l'élément performait avant, il a baissé sur
      trois relevés, il revient à son état antérieur. Coût du retour faible
      (suffixe de 19 caractères, title de 61 caractères, non tronqué).
      À restaurer : src/i18n/messages/seo.ts ligne 26 (en.home.title),
      'Luxury Apartments in Tel Aviv | Or Hakerem | Kerem HaTeimanim'.
      Les variantes fr (ligne 106) et he (ligne 187), raccourcies dans le
      même commit 9009e5c, ne sont pas couvertes par cette baseline (URL /
      seule) : leur sort relève de l'étape suivante.

