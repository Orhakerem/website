# Registre des actions — Or Hakerem
#
# Chantiers ouverts qui ne sont pas terminés. Ce fichier est lu et redaté à
# CHAQUE cycle mensuel par l'agent `rapport` (étape 11). `scripts/seo-check.mjs`
# échoue si une entrée non terminée n'a pas été relancée pendant le cycle courant,
# et le rapport mensuel ne peut pas sortir tant que le script échoue.
#
# etat        : bloque | en-cours | fait
# responsable : proprietaire | claude
# Une entrée `fait` est supprimée au cycle suivant, pas archivée ici.
#
# ATTENTION FORMAT : toute ligne de note doit rester indentée. Une ligne qui
# commence en colonne 0 arrête la lecture du bloc `actions` par seo-check.mjs
# (c'était le cas de nap-telephone jusqu'au 05/11 : gbp-attribution et
# ga4-purchase-cle échappaient au contrôle).

