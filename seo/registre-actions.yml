  - id: collecte-avis
    action: Mettre en place une sollicitation d'avis conforme aux règles Google
    document: docs/google-business-profile-publication-plan.md
    responsable: proprietaire
    etat: bloque
    ouvert_depuis: 2026-10-26
    derniere_relance: 2026-11-05
    echeance: 2026-12-31
    impact: critique
    note: >-
      DEVENU LE LEVIER N°1 DU DOSSIER. 4 avis en tout, note 4,0. Le concurrent
      homonyme HaKerem Luxury Apartments affiche 9,4/10 sur 166 avis : l'écart
      de volume explique le mauvais classement de marque mieux que tout
      facteur technique. Et à 4 avis, un seul 1 étoile pèse 25 % de
      l'échantillon — la réponse structurelle n'est pas de faire retirer un
      avis, c'est d'en collecter assez pour qu'il redevienne du bruit.
      Le filtrage préalable (review gating) est interdit par Google : la
      sollicitation doit viser TOUS les clients, sans incitation, après le
      départ, jamais sur place. Sanction possible : dépublication des avis
      existants et avertissement public sur la fiche.
      05/11 (cycle 2026-11) : toujours 4 avis, note 4,0, aucun nouvel avis en
      octobre (gbp, 04/11). Sur la recherche « hakerem », l'aperçu IA affiche
      Hakerem Luxury Apartments 4,9 sur 54 avis contre Or Hakerem 4,0 sur 4
      (serp, indicatif). Dispositif toujours non posé ; rappelé au registre
      reconduit du rapport.

  - id: entite-concurrente
    action: Instruire la collision de marque avec « Hakerem Luxury Apartments »
    document: seo/releves/2026-11.yml
    responsable: claude
    etat: en-cours
    ouvert_depuis: 2026-10-26
    derniere_relance: 2026-11-05
    echeance: 2026-12-31
    impact: moyen
    note: >-
      hakeremluxuryapartments.co.il est une entreprise distincte au nom très
      proche. La requête `hakerem luxury apartments` (152 impressions,
      position 5,3) est probablement leur marque, pas la nôtre. L'audit d'août
      attribuait le mauvais classement de marque à une « collision d'entité » :
      voici le candidat. À confirmer avant d'en tirer une conclusion.
      05/11 (cycle 2026-11) : SERP de marque du 04/11 (session connectée,
      indicative, écartée comme source de position). « Or Hakerem » :
      orhakerem.com 1er avec 6 sitelinks et panneau de connaissance (4,0, 4
      avis), mais le concurrent occupe Booking (4e), son site (5e et 12e),
      Agoda (6e), Skyscanner (7e) et Tripadvisor (9e). « hakerem » :
      ha-kerem.co.il 1er, hakeremluxuryapartments.co.il 2e, orhakerem.com 3e.
      GSC octobre : `hakerem luxury apartments` 36 impressions, position 5,9,
      0 clic (47 et 2 clics en septembre) ; `or hakerem` 0 impression (14 en
      septembre). Collision confirmée qualitativement ; décision du diagnostic :
      ne pas optimiser sur `hakerem` ni `hakerem luxury apartments`. Reste à
      statuer sur `or hakerem` : le 05/11, le propriétaire renonce à trancher
      anonymisation ou perte réelle (volume trop faible) ; une seule mesure,
      les impressions de novembre de la requête exacte, au cycle 2026-12,
      d'où l'échéance portée au 31/12. 0 impression deux mois de suite →
      perte probable, instruite ici avec un contrôle manuel du SERP de
      marque ; au moins 1 → sujet clos. La mesure et son critère (requête
      exacte `or hakerem`, impressions de novembre) sont dans
      seo/prochain-cycle.yml (a_surveiller, lectures H1-H7 et marque) ; ce
      registre ne garde que l'instruction de la collision de marque.

