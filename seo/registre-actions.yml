  - id: ga4-purchase-cle
    action: Arbitrer l'alerte sentinelle — retirer `purchase` des événements clés GA4, ou exclure de la règle les événements jamais déclenchés
    document: docs/agents-seo.md
    responsable: proprietaire
    etat: fait
    ouvert_depuis: 2026-11-04
    derniere_relance: 2026-11-04
    echeance: 2026-11-10
    impact: critique
    note: >-
      A INTERROMPU LE CYCLE 2026-11 à l'étape 0. `purchase` est déclaré
      événement clé dans la propriété 521216501, à 0 sur 30 j et jamais
      déclenché depuis la création (vérifié le 04/11 sur la plage maximale). Le
      site n'a pas de tunnel d'achat et ne l'émettra jamais : l'audit du 25/08
      (lignes 87-97) recommandait déjà de le retirer. Rien n'est cassé, mais la
      règle « événement clé à 0 sur 30 j = alerte » s'applique telle qu'elle est
      écrite, et elle se déclenchera à chaque cycle tant que rien ne change.
      Retirer l'événement est un réglage GA4 : il faut l'accord du propriétaire.
      Le cycle reprend dès que l'arbitrage est rendu.
      04/11 : ACCORD DONNÉ pour le retrait, mais le RETRAIT EST IMPOSSIBLE.
      Dans GA4, l'option « Ne plus marquer comme événement clé » est désactivée
      pour `purchase`, et son étoile est grisée : c'est un événement clé par
      défaut, verrouillé par Google. Rien n'a été modifié. Seule issue restante :
      préciser la règle de la sentinelle (exclure les événements clés jamais
      déclenchés) dans la tâche planifiée, ce qui demande un nouvel accord.
      TRANCHÉ le 04/11 : la règle de la sentinelle est précisée, avec
      l'accord du propriétaire. Seul un événement clé déjà déclenché qui tombe
      à 0 est une alerte (docs/agents-seo.md, étape 0, et décision consignée
      dans la tâche planifiée). Cycle 2026-11 relancé le même jour.
      À supprimer de ce registre au cycle de décembre.

