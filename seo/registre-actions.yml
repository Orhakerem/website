    document: docs/google-business-profile-publication-plan.md
    responsable: claude
    etat: fait
    ouvert_depuis: 2026-10-26
    derniere_relance: 2026-10-27
    echeance: null
    impact: moyen
    note: >-
TRANCHÉ le 27/10 : les DEUX numéros sont cliquables. Appliqué —
      la page contact expose maintenant +33651179925 et +972585778891 en liens
