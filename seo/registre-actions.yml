  - id: entite-concurrente
    action: Instruire la collision de marque avec « Hakerem Luxury Apartments »
    document: null
    responsable: claude
    etat: bloque
    ouvert_depuis: 2026-10-26
    derniere_relance: 2026-10-26
    echeance: 2026-11-30
    impact: moyen
    note: >-
      hakeremluxuryapartments.co.il est une entreprise distincte au nom très
      proche. La requête `hakerem luxury apartments` (152 impressions,
      position 5,3) est probablement leur marque, pas la nôtre. L'audit d'août
      attribuait le mauvais classement de marque à une « collision d'entité » :
      voici le candidat. À confirmer avant d'en tirer une conclusion.

  - id: gbp-entite
    action: Trancher l'entité portée par la fiche — une seule fiche ou deux
    document: docs/google-business-profile-publication-plan.md
    responsable: proprietaire
    etat: fait
    ouvert_depuis: 2026-10-26
    derniere_relance: 2026-10-27
    echeance: null
    impact: eleve
    note: >-
      TRANCHÉ le 27/10 : une enseigne permanente au nom de l'entreprise existe
      sur place. Conséquences : (1) l'élément 2 d'une revérification vidéo est
      satisfaisable — filmer l'enseigne, pas un intérieur de logement ;
      (2) l'éligibilité est démontrable, l'entité portée par la fiche reste
      l'activité de gestion / l'espace événementiel, jamais un appartement ;
      (3) UNE SEULE FICHE. Une seconde fiche pour l'événementiel exigerait un
      nom différent ET une seconde enseigne permanente distincte : à rouvrir
      seulement si cette seconde enseigne existe.
      À supprimer de ce registre au cycle de décembre.

  - id: gbp-horaires
    action: Reporter les horaires d'accueil sur la fiche Google
    document: docs/google-business-profile-publication-plan.md
    responsable: claude
    etat: en-cours
    ouvert_depuis: 2026-10-26
    derniere_relance: 2026-10-27
    echeance: 2026-11-30
    impact: eleve
    note: >-
      Horaires obtenus le 27/10 : dimanche-jeudi 08:00-19:00, vendredi
      08:00-12:00, samedi fermé (Shabbat). CÔTÉ SITE : FAIT — BUSINESS_HOURS
      et openingHoursSpecification dans business-schema.ts, vérifiés dans le
      JSON-LD servi, couverts par deux tests. RESTE : les déclarer sur la fiche
      elle-même, ce qui est un des points de contrôle de l'affichage du logo et
      ce qui rend l'éligibilité démontrable (contact en personne PENDANT LES
      HORAIRES DÉCLARÉS). Couvert par l'autorisation permanente.

  - id: gbp-categories
    action: Relever les libellés exacts des catégories dans le sélecteur et les poser
    document: docs/google-business-profile-publication-plan.md
    responsable: claude
    etat: bloque
    ouvert_depuis: 2026-10-26
    derniere_relance: 2026-10-26
    echeance: 2026-11-30
    impact: moyen
    note: >-
      Google ne publie pas la liste des catégories ; les listes tierces sont
      indicatives et plusieurs libellés candidats n'ont pas pu être confirmés.
      Cible : principale de type agence de location saisonnière (préserve le
      format Offre, qu'une catégorie d'hôtellerie supprime), plus la catégorie
      d'espace événementiel. Pas de catégorie-mot-clé (conciergerie, tourisme).

