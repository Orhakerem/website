  - id: collecte-avis
    action: Mettre en place une sollicitation d'avis conforme aux règles Google
    document: docs/google-business-profile-publication-plan.md
    responsable: proprietaire
    etat: bloque
    ouvert_depuis: 2026-10-26
    derniere_relance: 2026-10-27
    echeance: 2026-12-31
    impact: critique
    note: >-
      DEVENU LE LEVIER N°1 DU DOSSIER. 4 avis en tout, note 4,0. Le concurrent
      homonyme HaKerem Luxury Apartments affiche 9,4/10 sur 166 avis : l'écart
      de volume explique le mauvais classement de marque mieux que tout
      facteur technique. Et à 4 avis, un seul 1 étoile pèse 25 % de
      l'échantillon — la réponse structurelle n'est pas de faire retirer un
      avis, c'est d'en collecter assez pour qu'il redevienne du bruit.
      Le filtrage préalable (review gating) est interdit par Google : la
      sollicitation doit viser TOUS les clients, sans incitation, après le
      départ, jamais sur place. Sanction possible : dépublication des avis
      existants et avertissement public sur la fiche.

